name: 打包安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          [ -d "$SDKROOT" ] || { echo "找不到 Android SDK：$SDKROOT"; exit 1; }
          SDKM=$(ls "$SDKROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager = $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成安卓工程
        run: npx cap add android

      - name: 生成启动图标与开屏图
        run: npx @capacitor/assets generate --android

      - name: 同步 Web 资源
        run: npx cap sync android

      - name: 注入桌面小组件
        run: bash scripts/inject-android.sh

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查产物
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          echo "APK 路径：$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: zhuzhucheng-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
