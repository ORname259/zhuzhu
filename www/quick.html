<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="快速记一斤">
<meta name="description" content="猪猪称 · 桌面快捷录入，两步记一斤">
<title>快速记一斤</title>
<link rel="manifest" href="manifest-quick.json">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding-bottom: 24px; }
  .app { padding-bottom: 24px; }
  .q-head { display: flex; align-items: center; gap: 9px; padding: calc(14px + env(safe-area-inset-top)) 2px 10px; }
  .q-head b { font-size: 15px; }
  .q-head a { margin-left: auto; font-size: 11.5px; color: var(--ink-3); text-decoration: none; }
  .q-card { padding: 16px 14px 14px; }
  .q-date { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .q-done { text-align: center; padding: 34px 10px 30px; }
  .q-done .big { font-size: 34px; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .q-done p { font-size: 13px; color: var(--ink-2); margin: 6px 0 16px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="q-head">
    <img class="mascot" src="assets/pig.jpg" alt="" width="34" height="34">
    <b>快速记一斤</b>
    <a href="index.html">完整记录 ›</a>
  </div>

  <div class="card q-card" id="q-form">
    <div class="entry-display">
      <span id="entry-value" class="empty" data-ph="按数字键输入"></span><i class="unit">斤</i>
    </div>
    <div class="entry-sub">
      <span id="entry-hint"></span>
      <button id="quote-btn" class="link-btn">引用上次</button>
    </div>
    <div class="q-date">
      <input type="date" id="d-date" class="chip-input">
      <input type="time" id="d-time" class="chip-input">
    </div>
    <div id="keypad" class="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k=".">.</button><button data-k="0">0</button><button data-k="del" class="fn">⌫</button>
    </div>
    <button id="save-btn" class="save"><span>记一斤</span></button>
  </div>

  <div class="card q-done hide" id="q-done">
    <div class="big" id="done-val"></div>
    <p id="done-msg"></p>
    <button class="btn2 primary" id="again-btn">再记一次</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/store.js"></script>
<script src="js/stats.js"></script>
<script src="js/bridge.js"></script>
<script src="js/quick.js"></script>
</body>
</html>
